# SPDX-License-Identifier: GPL-3.0-only
name: Release Miyoo installation
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: miyoo-package-${{ github.sha }}
          path: dist
      - name: Verify tag, installation, exact matching source and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/packaging/release_notes.py --public --version "$version" --output RELEASE_NOTES.md
          python3 scripts/packaging/verify_release.py --version "$version"
      - name: Publish tested installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "GrainMM $RELEASE_TAG" --notes-file RELEASE_NOTES.md \
            "${flags[@]}" dist/GrainMM-*-miyoo-mini-plus.zip dist/GrainMM-*-miyoo-mini-plus.zip.sha256 \
            dist/GrainMM-*-source.tar.gz dist/GrainMM-*-source.tar.gz.sha256
